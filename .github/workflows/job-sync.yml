name: Synchronisation des offres

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: jobpulse-sync
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source:
          - france-travail
          - la-bonne-alternance
          - greenhouse
          - lever
          - ashby
          - smartrecruiters
    steps:
      - name: Synchroniser ${{ matrix.source }}
        env:
          CRON_URL: ${{ secrets.JOBPULSE_CRON_URL }}
          CRON_SECRET: ${{ secrets.JOBPULSE_CRON_SECRET }}
          SOURCE: ${{ matrix.source }}
        run: |
          test -n "$CRON_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 10 \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${CRON_URL}?source=${SOURCE}"

  notify:
    needs: ingest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Envoyer les notifications Slack
        env:
          CRON_URL: ${{ secrets.JOBPULSE_CRON_URL }}
          CRON_SECRET: ${{ secrets.JOBPULSE_CRON_SECRET }}
        run: |
          test -n "$CRON_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 10 \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${CRON_URL}?source=notifications"
